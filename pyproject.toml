[project]
name = "hdfc-mistral-mvp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "itarafdar", email = "tarafdar.samrat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2==2.16.0",
    "chromadb==1.5.5",
    "mistralai==3.7.0",
    "mistralai-agents==1.1.0",
    "mistralai-workflows==3.20.0",
    "pillow==12.1.1",
    "python-dotenv==1.2.2",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.9",
]

[project.scripts]
hdfc-mistral-usecase = "hdfc_mistral_mvp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

